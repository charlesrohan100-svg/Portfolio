# docker-compose.yml   (project root)
services:
  db:
    image: postgres:17-alpine
    container_name: relational-fundamentals-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: charles
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: portfolio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U charles -d portfolio"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
